name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Build, test and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev \
            libgtk-4-dev \
            libwayland-dev \
            wayland-protocols \
            meson \
            ninja-build \
            pkg-config

      - name: Build gtk4-layer-shell from source
        # Ubuntu 24.04 does not ship libgtk-4-layer-shell-dev; build the
        # upstream v1.3.0 release instead.
        run: |
          git clone --depth 1 --branch v1.3.0 \
            https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          meson setup --prefix=/usr \
            -Dintrospection=false -Dvapi=false -Ddocs=false \
            -Dtests=false -Dexamples=false \
            /tmp/gtk4-layer-shell /tmp/gtk4-layer-shell-build
          ninja -C /tmp/gtk4-layer-shell-build
          sudo ninja -C /tmp/gtk4-layer-shell-build install
          sudo ldconfig

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Run tests
        run: cargo test --locked

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings
